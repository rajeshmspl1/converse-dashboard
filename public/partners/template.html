<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title></title>
<!-- Partner template: layout from /preview/home-v2.html; all text and colours come from the
     validated partner config (template.js). Nothing partner-specific lives in this file. -->
<style>
:root{
 --paper:#FFFFFF; --mist:#F4F2F5; --ink:#14202B; --soft:#5A5560; --rule:#E2DEE5;
 --teal:#0B7A72; --sun:#FFC61A; --alert:#E5484D;
 --f:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.nav{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;letter-spacing:-.01em}
.logo img{height:36px;width:auto}
.nav .btn{margin-left:auto;white-space:nowrap;flex-shrink:0}
.btn{display:inline-block;padding:12px 20px;border-radius:6px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);background:var(--ink);color:#fff}
.btn.o{background:transparent;color:var(--ink)}
.btn.s{background:var(--sun);border-color:var(--sun);color:#fff;font-size:19px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.hero{padding:80px 24px 72px;max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--fh,var(--f))}
h1{font-size:clamp(36px,5.2vw,60px);line-height:1.04;letter-spacing:-.03em;font-weight:800;margin:0;max-width:16ch}
.sub{font-size:19px;color:var(--soft);max-width:48ch;margin:22px 0 30px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--soft);margin-bottom:18px}
.live:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--alert);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live:before{animation:none}}
section{padding:80px 0}
section.m{background:var(--mist)}
h2{font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-.025em;font-weight:700;margin:0 0 14px;max-width:24ch}
.lede{color:var(--soft);font-size:18px;max-width:56ch;margin:0}
.jgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
@media(max-width:960px){.jgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.jgrid{grid-template-columns:1fr}}
.jcard{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--rule);border-top:4px solid var(--teal);border-radius:12px;padding:22px;transition:transform .15s}
.jcard:hover{transform:translateY(-3px);border-top-color:var(--sun)}
.jcard .jn{font-size:13px;font-weight:700;color:var(--ink)}
.jcard h3{font-size:19px;margin:6px 0 8px;letter-spacing:-.01em}
.jcard p{margin:0;color:var(--soft);font-size:15.5px}
.cta{background:var(--ink);color:#fff;border-radius:18px;padding:56px 44px;margin:0 0 72px}
@media(max-width:600px){.cta{padding:40px 24px}}
.cta h2{color:#fff}
.cta .lede{color:rgba(255,255,255,.78)}
footer{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:14px;color:var(--soft)}
</style>
<script type="module" src="/partners/template.js"></script>
</head><body hidden>
<nav><div class="wrap nav">
  <a class="logo" href="/"><img data-k="logo" alt="" hidden><span data-k="name"></span></a>
  <a class="btn o" href="/login">Log in</a>
</div></nav>
<header class="hero">
  <div class="live">Live demo line</div>
  <h1 data-k="hero_title"></h1>
  <p class="sub" data-k="hero_subtitle"></p>
  <a class="btn s" data-k="cta_label" href="/experience?journey=0"></a>
</header>
<section class="m"><div class="wrap">
  <h2 data-k="journeys_title"></h2>
  <div class="jgrid" data-k="journeys"></div>
</div></section>
<section><div class="wrap">
  <div class="cta">
    <h2 data-k="contact_title"></h2>
    <p class="lede" data-k="contact_text"></p>
  </div>
  <footer data-k="footer"></footer>
</div></section>
</body></html>
